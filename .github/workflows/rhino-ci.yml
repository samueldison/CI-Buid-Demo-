name: CI Pipeline

on:
  push:
    branches:
      - main     

permissions:
  contents: read
  security-events: write      

jobs:

  gitleaks_scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install Gitleaks
      run: |
        sudo apt-get update
        sudo apt-get install -y gitleaks 

    - name: Run Gitleaks Scan
      run: |
        gitleaks detect --source ./rhino-horn --report-path gitleaks-report.json --exit-code 1
        if [ $? -ne 0 ]; then
          echo "Gitleaks found issues. Please review the report."
        else
          echo "Gitleaks scan completed successfully. No issues found."
        fi

    - name: Upload Gitleaks Report
      uses: actions/upload-artifact@v7
      with:
        name: gitleaks-report
        path: gitleaks-report.json

  dockerfile_security_check:
    needs: gitleaks_scan
    name: Dockerfile Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check Dockerfile for secure USER usage
        run: |
          chmod +x rhino-horn/dockerfile-check.sh
          ./rhino-horn/dockerfile-check.sh
      - name: Print Dockerfile Check Result
        run: |
          echo "Dockerfile USER validation completed."
   
  maven_build:
    needs: dockerfile_security_check
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        java: [17]
        
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}
        cache: 'maven'
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

    - name: Build with Maven
      run: |
       mvn -B package --file rhino-horn/pom.xml
       ls -l rhino-horn/target

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rhino-horn
        path: rhino-horn/target/

  sonar_cloud_scan:
    needs: maven_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar    

      - uses: actions/download-artifact@v4
        with:
          name: rhino-horn
          path: rhino-horn/target/

      - name: Display structure of downloaded files
        run: ls -l rhino-horn/target/

      - name: Sonarqube Scan (Maven Plugin)
        run: |
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -file rhino-horn/pom.xml \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  docker_build_scan_and_push:
    needs: sonar_cloud_scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: rhino-horn
          path: rhino-horn/target/

      - name: Build Docker image and scan with Trivy
        uses: docker/build-push-action@v7
        with:
          context: .
          file: rhino-horn/Dockerfile
          push: false
          load: true  
          tags: colanta06/rhino-horn:${{ steps.vars.outputs.SHORT_SHA }} \
                colanta06/rhino-horn:latest

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.68.2
          cache: true

      - name: Run Trivy image scan (HTML report)
        run: |
          trivy image \
            --format html \
            --output trivy-report-${{ steps.vars.outputs.SHORT_SHA }}.html \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --vuln-type 'os,library'\
            --ignore-unfixed \
            colanta06/rhino-horn:${{ steps.vars.outputs.SHORT_SHA }}

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report-${{ steps.vars.outputs.SHORT_SHA }}.html

      - name: Push Docker image (if scan passed)
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: rhino-horn/
          file: rhino-horn/Dockerfile
          push: true
          tags: colanta06/rhino-horn:${{ steps.vars.outputs.SHORT_SHA }}

  upload_trivy_report_to_s3:
    needs: docker_build_scan_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Download Trivy report artifact
        uses: actions/download-artifact@v8
        with:
          name: trivy-report
      - name: Display structure of downloaded files
        run: ls -l  
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload Trivy report to S3
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          aws s3 cp trivy-report-${SHORT_SHA}.html s3://${{ vars.BUCKET_NAME }}/reports/${{ github.sha }}-trivy-report-${SHORT_SHA}.html
      - name: Check Uploaded File
        run: |
          aws s3 ls s3://${{ vars.BUCKET_NAME }}/reports/